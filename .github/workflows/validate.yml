name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this job only reads the repository. The repository default is
# write so the auto-merge job can merge; pinning it here keeps this workflow at
# what it actually needs.
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: unit tests
        run: bash tests/run.sh
